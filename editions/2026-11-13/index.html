.6,"merged_count":1,"sources":[{"title":"Treasury Selects State Street's SPYM as Default ETF for Trump Accounts","url":"https://www.tipranks.com/news/treasury-selects-state-streets-spym-as-default-etf-for-trump-accounts-vanguard-and-blackrock-etfs-are-alternatives","publisher":"TipRanks","published_at":"2025-01-06T00:00:00Z"}]}]},{"id":"sector-healthcare","kind":"sector","title":"Healthcare","tickers":["OZEM"],"lede":"減肥藥市場持續增長，但醫生偏好開立Wegovy（專門減重配方），Ozempic份額流失至減重市場","sentiment":0.6,"stories":[{"id":"ozem-wegovy-65-ozempic-8-1qj6xus","event_key":null,"headline":"🏥 OZEM — Wegovy市佔擴大至65%，Ozempic使用量下滑8%","dek":"減肥藥市場持續增長，但醫生偏好開立Wegovy（專門減重配方），Ozempic份額流失至減重市場","body_md":"## 🟢 市場趨勢：減肥藥GLP-1市場持續擴張\n\n**2026年Q1** — Semaglutide（Ozempic/Wegovy主成分）市場持續快速增長，但品牌之間出現明顯分化。\n\n### 市場佔有率變化\n\n**Wegovy（減重專用）**：\n- **市佔率**：65%（所有semaglutide品牌中）\n- **Q1 2026銷售額**：YoY +12%\n- 醫生越來越偏好為肥胖治療開立Wegovy\n\n**Ozempic（糖尿病用）**：\n- **Q1 2026銷售額**：YoY -8%\n- 患者轉向Wegovy用於減重\n- 仍是T2D（第二型糖尿病）治療的領先semaglutide品牌\n- 但市佔率正在萎縮\n\n### 使用情形與市場評估\n\n**監管批准與臨床證據**：\n- **2020年**：FDA批准Ozempic降低T2D患者心臟病發作、中風或死亡風險\n- **2021年**：FDA批准更高劑量的semaglutide（Wegovy）用於治療肥胖\n\n**消費者認知**：\n- TikTok趨勢、名人代言、真實效果迅速讓semaglutide成為熱門減重方案\n- Indiana大學（2024）：「這引發了semaglutide突然的流行」\n\n**市場規模（2026-2035）**：\n- **肥胖適應症**將超越其他應用，成為semaglutide市場關鍵驅動力\n- 隨著消費者認知提高與供應限制緩解，採用率加速\n\n### 給藥途徑\n\n**注射劑型（主導市場）**：\n- 2025年佔87.2%最大營收份額\n- Ozempic和Wegovy均為注射劑型\n- 廣泛採用推動parenteral（注射）市場領先\n\n### 價格策略\n\n- **Novo Nordisk宣布**：大幅降低Wegovy、Ozempic和Rybelsus（semaglutide藥物）在美國的標價\n- 持續努力擴大可及性\n\n### 2026年趨勢總結\n\n1. **Wegovy主導減重市場**\n2. **Ozempic聚焦糖尿病治療**（但減重off-label使用減少）\n3. **供應限制逐漸緩解**\n4. **價格降低擴大可及性**\n5. **消費者認知持續提高**","tickers":["OZEM"],"sector":"Healthcare","importance":3,"sentiment":0.6,"merged_count":1,"sources":[{"title":"Semaglutide Statistics 2026: Ozempic & Wegovy Data, Clinical Outcomes & Market Trends","url":"https://wellness.goalbmi.com/semaglutide-statistics-2026/","publisher":"GoalBMI Wellness","published_at":"2026-01-01T00:00:00Z"},{"title":"Semaglutide in 2026: usage statistics, top brands, and market trends","url":"https://getheally.com/patients/news/semaglutide-in-2026-how-many-people-use-it-what-brands-lead-and-where-the-market-is-heading","publisher":"Heally","published_at":"2026-01-01T00:00:00Z"}]}]},{"id":"sector-staffing-hr","kind":"sector","title":"Staffing/HR","tickers":["KFY"],"lede":"Stephens新增買入評級（目標價$94），公司稱「AI生成完美履歷讓人力評估IP更關鍵」，Q1 2027營收持續增長","sentiment":0.7,"stories":[{"id":"kfy-korn-ferry-ai-1mkb0um","event_key":null,"headline":"💼 KFY — Korn Ferry連五季增長，AI強化人才評估需求","dek":"Stephens新增買入評級（目標價$94），公司稱「AI生成完美履歷讓人力評估IP更關鍵」，Q1 2027營收持續增長","body_md":"## 🟢 AI推動需求：Korn Ferry業務穩健成長\n\n**2026-11-13** — Korn Ferry受惠於AI對人力資源的影響，業務持續增長。\n\n### 最新分析師評級（11月13日）\n\n**Stephens**：\n- 新增評級：買入/Overweight\n- 目標價：$94\n- 這是新增覆蓋，顯示機構對人力業務信心\n\n### 過往評級\n\n- **Goldman Sachs**：維持買入，目標價$94（9月）\n- **Truist Financial**：維持買入，目標價$100（9月）\n- **UBS**：維持中性，目標價提高至$82（9月）\n\n### AI對業務的影響\n\n**Q1 2027財報會議重點**：\n- 管理層：「**AI實際上增加了對Korn Ferry專有數據的需求**」\n- 原因：「AI生成的『完美履歷』讓人類評估和IP更加關鍵」\n- AI讓履歷變得無差異化，反而凸顯人才評估專業的價值\n\n### 業務增長情況\n\n**連續五季營收增長**：\n- 多條服務線實現top-line growth\n- **美洲和EMEA地區**：新業務增長強勁\n- **跨解決方案轉介**：增加（顯示客戶黏性提高）\n\n**AI投資提升生產力**：\n- 未來AI投資將改善Organizational and Talent Solutions的生產力\n- 潛在營收增長與earnings正面影響\n\n### 人力業務情況\n\n**AI對staffing的影響**：\n- AI和緩慢增長迫使企業對人力配置做出關鍵決策\n- 為何「如此困難做對，又如此容易做錯」\n- Korn Ferry幫助企業將人力配置轉變為核心戰略職能（數位創新與AI支持）\n\n### 估值\n\n- **P/E比率**：約15.6倍earnings\n- 低於專業服務行業平均\n- 適合earnings導向的人力諮詢業務\n\n### 長期激勵計畫\n\n- **股東批准**：擴大長期激勵計畫（為吸引和留住人才）\n\n### 地理分部重組\n\n- **9月宣布**：將報告重新調整為新的地理分部\n- 提高財務透明度","tickers":["KFY"],"sector":"Staffing/HR","importance":3,"sentiment":0.7,"merged_count":1,"sources":[{"title":"Stephens Maintains Korn Ferry With Buy Rating, Maintains Target Price $94","url":"https://news.futunn.com/en/post/1004474297","publisher":"Futu","published_at":"2026-11-13T04:31:00Z"},{"title":"Why Korn Ferry Is Up 5.1% After AI-Focused Workforce Strategy","url":"https://simplywall.st/stocks/us/commercial-services/nyse-kfy/korn-ferry/news/why-korn-ferry-kfy-is-up-51-after-ai-focused-workforce-strat/amp","publisher":"Simply Wall St","published_at":"2026-10-01T00:00:00Z"},{"title":"Korn Ferry Q1 2027 Earnings Call Summary","url":"https://finance.yahoo.com/markets/stocks/articles/korn-ferry-q1-2027-earnings-204653575.html","publisher":"Yahoo Finance","published_at":"2026-09-01T00:00:00Z"}]}]}]};
