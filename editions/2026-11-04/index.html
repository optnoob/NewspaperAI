D)**\n\n### 2026年6月重大規則變更\n- **生效日**：2026-06-22\n- **新規則**：採用完整市值（full market cap）計算\n- **舊規則**：使用自由流通市值\n- **影響**：大型科技股權重可能進一步上調\n\n### 歷史統計（2007-2026）\n- **總變動次數**：226次成分股變更\n- **年均變動**：約12次\n- **變動範圍**：最少7次（2010、2014、2024），最多21次（2015）\n\n## 🎯 對你的持股影響\n\n### QQQM（Nasdaq-100 ETF）\n**10月變動影響**：\n- ✅ **加入MRNA**：生技股權重微增\n  - Moderna市值：約$200B\n  - 指數權重：預估<1%\n- ➖ **移除WBD**：媒體股權重下降\n\n**6月規則變更影響**（已生效）：\n- 大型科技股（AAPL, MSFT, NVDA, GOOG, AMZN, META, TSLA）權重上調\n- QQQM年初至今（截至11/2）：表現優異\n- 12個月報酬：+40%（超越大盤）\n\n### SPYM（S&P 500 ETF）\n**10月變動影響**：\n- ✅ **加入TWLO**：雲通訊平台\n  - 產業：軟體/通訊\n  - 市值：約$80B\n- ➖ **移除WBD**：傳媒\n- ➖ **移除CTVA**：農業科技\n\n**Trump Accounts效應**：\n- SPYM被選為預設ETF（2026-07-03公告）\n- 資金流入：約$30B\n- 年初至今：+10.9%\n- 過去12個月：+22%\n- 10年累積報酬：+320.79%\n\n## ⚠️ 警示：被動資金流動\n\n### 指數調整的機械性買賣\n1. **公告效應**：成分股變動公告後股價立即反應\n2. **生效日集中交易**：追蹤指數的基金必須在收盤前調整\n3. **流動性衝擊**：單日可能數十億美元資金流動\n\n### 投資者注意事項\n- **避免生效日當天追高**：被動資金已反映\n- **關注下次調整預告**：通常提前1-2週公告\n- **季度調整時間**：\n  - Q1: 3月第三週五\n  - Q2: 6月第三週五\n  - Q3: 9月第三週五\n  - Q4: 12月第三週五","tickers":["QQQM","SPYM"],"sector":"ETF/Index","importance":3,"sentiment":0,"merged_count":1,"sources":[{"title":"S&P 500 Additions and Deletions 2026","url":"https://historyofmarket.com/sp500/changes/","publisher":"History of Market","published_at":"2026-10-06T00:00:00Z"},{"title":"Nasdaq 100 Additions and Deletions: Reconstitution Log","url":"https://historyofmarket.com/nasdaq/ndx-changes/","publisher":"History of Market","published_at":"2026-10-09T00:00:00Z"},{"title":"Invesco NASDAQ 100 ETF Up 40% in 12 Months","url":"https://www.techtimes.com/articles/317618/20260602/invesco-nasdaq-100-etf-40-12-months-june-rebalance-brings-new-rules-qqqm.htm","publisher":"Tech Times","published_at":"2026-06-02T00:00:00Z"}]}]},{"id":"sector-staffing-hr","kind":"sector","title":"Staffing/HR","tickers":["KFY"],"lede":"Korn Ferry研究顯示AI對招聘業務影響深遠，技能缺口擴大將重塑人才市場","sentiment":0.4,"stories":[{"id":"kfy-ai-84-2026-ai-1mojpq0","event_key":null,"headline":"🟢 KFY — AI重塑人才招聘，84%企業計劃2026採
